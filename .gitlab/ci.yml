---
include:
  - template: Jobs/Secret-Detection.gitlab-ci.yml

  - project: renovate-bot/renovate-runner
    file: /templates/renovate-config-validator.gitlab-ci.yml

stages:
  - test

vint:
  stage: test
  image: alpine:3.24@sha256:28bd5fe8b56d1bd048e5babf5b10710ebe0bae67db86916198a6eec434943f8b
  script:
    - apk add py3-setuptools vint
    - vint --color --warning vim/vimrc vim/*.vim
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - vim/vimrc
        - vim/*.vim

shellcheck:
  stage: test
  image: koalaman/shellcheck-alpine:v0.11.0@sha256:9955be09ea7f0dbf7ae942ac1f2094355bb30d96fffba0ec09f5432207544002
  script:
    - |
      shellcheck \
          bash/bashrc \
          sh/profile \
          $(find sh/inc -type f -name '*.sh') \
          X11/xsession \
          X11/xsessionrc \
          yadm/bootstrap
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - bash/bashrc
        - sh/profile
        - sh/inc/*.sh
        - X11/xsession
        - X11/xsessionrc
        - yadm/bootstrap

shfmt:
  stage: test
  image: mvdan/shfmt:v3.13.1-alpine@sha256:3bd333f7861b51081af39a8ba722c0023983362b46332849aaf57c6d32d96b25
  script:
    - |
      shfmt -d -l -i 2 -ci \
          bash/bashrc \
          sh/profile \
          $(find sh/inc -type f -name '*.sh') \
          X11/xsession \
          X11/xsessionrc \
          yadm/bootstrap
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - bash/bashrc
        - sh/profile
        - sh/inc/*.sh
        - X11/xsession
        - X11/xsessionrc
        - yadm/bootstrap
