---
include:
  - template: Jobs/Secret-Detection.gitlab-ci.yml

  - project: renovate-bot/renovate-runner
    file: /templates/renovate-config-validator.gitlab-ci.yml

stages:
  - test

.default-branch: &default-branch
  if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

.merge-request: &merge-request
  if: $CI_PIPELINE_SOURCE == "merge_request_event"

.alpine:
  image: alpine:3.24@sha256:f59abe656b692d901e184be3445e084786602108599d2a51d229c0f5a48c71bf

vint:
  extends: .alpine
  stage: test
  script:
    - apk add py3-setuptools vint
    - vint --color --warning vim/vimrc vim/*.vim
  rules:
    - *default-branch
    - <<: *merge-request
      changes:
        - .gitlab/ci.yml
        - vim/vimrc
        - vim/*.vim

# Shell files are discovered by shebang or extension. Zsh files are excluded:
# shellcheck does not support zsh and shfmt does not fully support it yet.
shell-files:
  stage: test
  image: mvdan/shfmt:v3.14.1-alpine@sha256:c7a0dfa73dfea80e9d9e185c655b44759eea2df85dec142295bcc0bb600c6266
  script:
    - shfmt -f . | grep -v '\.zsh$' | sort | tee shell-files.txt
  artifacts:
    paths:
      - shell-files.txt
    expire_in: 1 hour
  rules:
    - *default-branch
    - *merge-request

shellcheck:
  stage: test
  image: koalaman/shellcheck-alpine:v0.11.0@sha256:9955be09ea7f0dbf7ae942ac1f2094355bb30d96fffba0ec09f5432207544002
  needs:
    - shell-files
  script:
    - |
      xargs shellcheck --external-sources --source-path=SCRIPTDIR \
          < shell-files.txt
  rules:
    - *default-branch
    - *merge-request

shfmt:
  stage: test
  image: mvdan/shfmt:v3.14.1-alpine@sha256:c7a0dfa73dfea80e9d9e185c655b44759eea2df85dec142295bcc0bb600c6266
  needs:
    - shell-files
  script:
    - xargs shfmt -d -l -i 2 -ci < shell-files.txt
  rules:
    - *default-branch
    - *merge-request

zsh-syntax:
  extends: .alpine
  stage: test
  script:
    - apk add zsh
    - |
      status=0
      for f in zsh/.zlogin zsh/.zshenv zsh/.zshrc zsh/inc/*.zsh; do
        zsh -n "${f}" || status=1
      done
      exit "${status}"
  rules:
    - *default-branch
    - <<: *merge-request
      changes:
        - .gitlab/ci.yml
        - zsh/**/*.zsh
        - zsh/.zlogin
        - zsh/.zshenv
        - zsh/.zshrc

fish:
  extends: .alpine
  stage: test
  script:
    - apk add fish
    - find fish -name '*.fish' | sort > fish-files.txt
    - xargs fish_indent --check < fish-files.txt
    - |
      status=0
      while read -r f; do
        fish --no-execute "${f}" || status=1
      done < fish-files.txt
      exit "${status}"
  rules:
    - *default-branch
    - <<: *merge-request
      changes:
        - .gitlab/ci.yml
        - fish/**/*.fish

stylua:
  extends: .alpine
  stage: test
  script:
    - apk add stylua
    - |
      status=0
      for d in nvim wezterm; do
        (cd "${d}" && stylua --check .) || status=1
      done
      exit "${status}"
  rules:
    - *default-branch
    - <<: *merge-request
      changes:
        - .gitlab/ci.yml
        - nvim/**/*.lua
        - nvim/.stylua.toml
        - wezterm/**/*.lua
        - wezterm/.stylua.toml

json:
  extends: .alpine
  stage: test
  script:
    - apk add prettier
    - prettier --check '**/*.json' '**/*.jsonc'
  rules:
    - *default-branch
    - <<: *merge-request
      changes:
        - .gitlab/ci.yml
        - "**/*.json"
        - "**/*.jsonc"

yamllint:
  extends: .alpine
  stage: test
  script:
    - apk add yamllint
    - yamllint --strict .
  rules:
    - *default-branch
    - <<: *merge-request
      changes:
        - .gitlab/ci.yml
        - .yamllint.yaml
        - "**/*.yml"
        - "**/*.yaml"
