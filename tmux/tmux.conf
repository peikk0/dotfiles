# TPM
set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.local/share/tmux/plugins/'
set-option -g @plugin 'tmux-plugins/tpm'

# Plugins
set-option -g @plugin 'catppuccin/tmux'
set-option -g @plugin 'fcsonline/tmux-thumbs'
set-option -g @plugin 'junegunn/tmux-fzf-url'
set-option -g @plugin 'sainnhe/tmux-fzf'

# Catppuccin theme
set-option -g @catppuccin_flavor 'mocha'
set-option -g @catppuccin_window_status_style "rounded"

run-shell '~/.local/share/tmux/plugins/tmux/catppuccin.tmux'

set-option -g status on
set-option -g status-interval 1
set-option -g status-justify left

set-option -g status-left "#{E:@catppuccin_status_session}"
set-option -g status-right "#{E:@catppuccin_status_host}"

# Vi keys
set-option -g status-keys vi


# Bell in all windows
set-option -g bell-action any

# History size
set-option -g history-limit 50000

# 256 colors / truecolors
set-option -g default-terminal 'tmux-256color'
set-option -ga terminal-features ',*256col*:256,*256col*:RGB'

# Cursor
set-option -ga terminal-features ',xterm*:ccolour,wezterm:ccolour'
# set-option -ga terminal-features ',xterm*:cstyle,wezterm:cstyle'
# Disable cursor shape changes
set-option -ga terminal-overrides ",xterm*:Ss=:Se=,wezterm:Ss=:Se="

# Italic
set-option -ga terminal-overrides ",xterm*:sitm=\e[3m:ritm=\e[25m,wezterm:sitm=\e[3m:ritm=\e[25m"

# Strikethrough,
set-option -ga terminal-features ',xterm*:strikethrough,wezterm:strikethrough'

# Underscore style/colour
set-option -ga terminal-features ',xterm*:usstyle,wezterm:usstyle'

# Overline
set-option -ga terminal-features ',xterm*:overline,wezterm:overline'

# OSC 7
set-option -ga terminal-features ',xterm*:osc7,wezterm:osc7'

# Hyperlinks
set-option -ga terminal-features ',xterm*:hyperlinks,wezterm:hyperlinks'

# Clipboard
set-option -ga terminal-features ',xterm*:clipboard,wezterm:clipboard'
set-option -g set-clipboard on

# Allow window renaming
set-option -g allow-rename on

# Automatic renaming
set-window-option -g automatic-rename on

# Update term title
set-option -ga terminal-features ',xterm*:title,wezterm:title'
set-option -g set-titles on
set-option -g set-titles-string 'tmux: #T'

# Extended keys
set-option -g extended-keys on
set-option -g extended-keys-format csi-u

# Disable mouse support
set-option -g mouse off

# Vi mode
set-window-option -g mode-keys vi

# Don't detach when ending a session
set-option -g detach-on-destroy off

# List URLs to open in a popup
set -g @fzf-url-fzf-options '-p 50%,40% --multi --exit-0 --no-preview --prompt "󰖟 "'

# C-a like GNU screen
set-option -g prefix C-a
unbind-key C-b
bind-key a send-prefix

# New session prompt
bind-key '`' command-prompt 'new-session -s %%'

# Additionnal/redefine bindings for new/next/previous window, etc.
bind-key '"' split-window -c "#{pane_current_path}"
bind-key % split-window -h -c "#{pane_current_path}"
bind-key c new-window
bind-key C-a last-window

# Moving between panes
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# Panes synchronization bindings
bind-key = set-window-option synchronize-panes

# Binding for man
bind-key / command-prompt "split-window 'exec man %%'"

# Unbind clock
unbind-key t

# Local config
if-shell 'test -f ~/.config/tmux/local.conf' 'source ~/.config/tmux/local.conf'

run-shell '~/.local/share/tmux/plugins/tpm/tpm'
